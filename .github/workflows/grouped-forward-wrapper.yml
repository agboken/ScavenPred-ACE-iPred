name: Grouped nested forward-wrapper verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grouped-forward-wrapper.yml'
      - 'reproducibility/scripts/grouped_nested_forward_wrapper_cv.py'
      - 'reproducibility/scripts/strict_group_nested_validation.py'
      - 'reproducibility/scripts/unpack_data.py'
      - 'reproducibility/requirements.txt'
      - 'reproducibility/data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: reproducibility/requirements.txt
      - name: Install pinned reproducibility dependencies
        run: python -m pip install -r reproducibility/requirements.txt
      - name: Restore and verify checksum of training data
        run: python reproducibility/scripts/unpack_data.py
      - name: Rerun grouped nested forward wrapper for both predictors
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >
          python reproducibility/scripts/grouped_nested_forward_wrapper_cv.py
          --data reproducibility/data/csv
          --out grouped_wrapper_results
          --model both --inner-trees 40 --candidate-limit 12
      - name: Recompute out-of-fold metrics and assert reported matrices
        run: |
          python - <<'PY'
          import json, pandas as pd
          from sklearn.metrics import accuracy_score,matthews_corrcoef,roc_auc_score,average_precision_score,confusion_matrix
          cases={
              'scavenpred':(1648,[[675,196],[296,481]],0.39979072085868017),
              'ace-ipred':(1933,[[655,244],[259,775]],0.477641534350593)}
          for name,(n,expected_matrix,expected_mcc) in cases.items():
              r=json.load(open('grouped_wrapper_results/'+name+'_wrapper_group_report.json'))
              d=pd.read_csv('grouped_wrapper_results/'+name+'_wrapper_group_oof.csv')
              assert len(d)==n and d.sequence.is_unique and d.fold.nunique()==5
              assert all(f['validation_group_disjoint'] for f in r['folds'])
              matrix=confusion_matrix(d.actual,d.prediction,labels=[0,1]).tolist()
              assert matrix==expected_matrix,(name,matrix)
              assert abs(matthews_corrcoef(d.actual,d.prediction)-expected_mcc)<1e-9
              for k,v in [('oof_accuracy',accuracy_score(d.actual,d.prediction)),
                          ('oof_mcc',matthews_corrcoef(d.actual,d.prediction)),
                          ('oof_roc_auc',roc_auc_score(d.actual,d.positive_probability)),
                          ('oof_pr_auc',average_precision_score(d.actual,d.positive_probability))]:
                  assert abs(r[k]-v)<1e-12,(name,k,r[k],v)
              print(name,'PASS n',n,'MCC',r['oof_mcc'],'accuracy',r['oof_accuracy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grouped-nested-forward-wrapper-predictions
          path: grouped_wrapper_results/
          retention-days: 90
